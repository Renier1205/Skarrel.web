<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skarrel — Auth Test (Phase 1)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap');
  :root{
    --ink:#4A3B2D; --paper:#F3EADA; --paper-card:#FBF6EA; --clay:#C1774A;
    --value-green:#74845A; --line:#DCCEAF;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Quicksand',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  h1{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px; margin:0 0 6px; }
  .box{ background:var(--paper-card); border-radius:20px; padding:30px; max-width:400px; width:100%; box-shadow:0 20px 40px rgba(40,30,15,.15); }
  p.sub{ opacity:.7; font-size:13.5px; margin:0 0 20px; line-height:1.5; }
  label{ font-weight:700; font-size:11px; text-transform:uppercase; opacity:.6; display:block; margin:14px 0 4px; }
  input{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'Quicksand',sans-serif; font-weight:600; font-size:16px; background:var(--paper); color:var(--ink); }
  button{ margin-top:18px; width:100%; background:var(--value-green); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  button.secondary{ background:transparent; border:1.5px solid var(--line); color:var(--ink); margin-top:8px; }
  button:disabled{ opacity:.5; }
  #status{ margin-top:16px; font-size:13px; font-weight:700; padding:10px 12px; border-radius:10px; display:none; word-break:break-word; }
  #status.ok{ background:#E5EADA; color:var(--value-green); display:block; }
  #status.err{ background:#F3E1D3; color:var(--clay); display:block; }
  #loadError{ display:none; background:#F3E1D3; color:var(--clay); padding:14px 16px; border-radius:12px; font-size:12.5px; font-weight:700; margin-bottom:16px; line-height:1.5; }
  #loggedInView{ display:none; }
</style>
</head>
<body>

<div class="box">
  <div id="loadError"></div>

  <div id="authView">
    <h1>Skarrel — Auth Test</h1>
    <p class="sub">Phase 1: confirming real Supabase sign-up and login actually work on your live domain, before the rest of the app gets migrated to use it.</p>

    <label>Name</label>
    <input id="name" type="text" placeholder="e.g. Renier">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="At least 6 characters">

    <button id="signUpBtn">Create account</button>
    <button id="signInBtn" class="secondary">I already have an account — log in</button>

    <div id="status"></div>
  </div>

  <div id="loggedInView">
    <h1>You're in ✅</h1>
    <p class="sub" id="loggedInSub"></p>
    <button id="signOutBtn" class="secondary">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const $ = (id) => document.getElementById(id);

  function showLoadError(msg){
    const el = $('loadError');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
    $('signUpBtn').disabled = true;
    $('signInBtn').disabled = true;
  }

  function showStatus(msg, isError){
    const el = $('status');
    el.textContent = msg;
    el.className = isError ? 'err' : 'ok';
  }

  function showLoggedIn(user, profileName){
    $('authView').style.display = 'none';
    $('loggedInView').style.display = 'block';
    $('loggedInSub').textContent = `Signed in as ${profileName || user.email} (${user.email}). This confirms real Supabase auth is working end-to-end on this domain.`;
  }

  // ---- Catch any error anywhere on this page and surface it, instead of failing silently ----
  window.addEventListener('error', (e)=>{
    showLoadError('Something went wrong: ' + (e.message || 'unknown error') + '. Try reloading the page — if this keeps happening, screenshot this message.');
  });

  let supabaseClient = null;

  try{
    if(typeof window.supabase === 'undefined'){
      throw new Error('The Supabase library did not load. This is usually a connection issue — try reloading the page.');
    }

    const SUPABASE_URL = "https://fawfdeiphmxyjvyoeeyv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhd2ZkZWlwaG14eWp2eW9lZXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzY0OTUsImV4cCI6MjEwMTQxMjQ5NX0.mAnvidHIW0saISLG3-utWkXOMefmENHGkCbAD8O455s";

    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(err){
    showLoadError(err.message);
  }

  $('signUpBtn').addEventListener('click', async () => {
    if(!supabaseClient){ showLoadError('Supabase never finished loading — try reloading the page.'); return; }

    const btn = $('signUpBtn');
    const name = $('name').value.trim();
    const email = $('email').value.trim();
    const password = $('password').value;
    if(!name){ showStatus('Enter your name.', true); return; }
    if(!email || !password || password.length < 6){ showStatus('Enter a valid email and a password of at least 6 characters.', true); return; }

    btn.disabled = true;
    const origText = btn.textContent;
    btn.textContent = 'Creating…';

    try{
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error){ showStatus('Sign-up failed: ' + error.message, true); return; }

      if(data.user){
        const { error: profileError } = await supabaseClient.from('profiles').insert({ id: data.user.id, name });
        if(profileError){
          showStatus('Account created, but saving your profile failed: ' + profileError.message, true);
          return;
        }
        showStatus('Account created!', false);
        showLoggedIn(data.user, name);
      } else {
        showStatus('Check your email to confirm your account, then log in.', false);
      }
    }catch(err){
      showStatus('Unexpected error: ' + err.message, true);
    }finally{
      btn.disabled = false;
      btn.textContent = origText;
    }
  });

  $('signInBtn').addEventListener('click', async () => {
    if(!supabaseClient){ showLoadError('Supabase never finished loading — try reloading the page.'); return; }

    const email = $('email').value.trim();
    const password = $('password').value;
    if(!email || !password){ showStatus('Enter your email and password.', true); return; }

    try{
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error){ showStatus('Login failed: ' + error.message, true); return; }

      const { data: profile } = await supabaseClient.from('profiles').select('name').eq('id', data.user.id).single();
      showLoggedIn(data.user, profile ? profile.name : null);
    }catch(err){
      showStatus('Unexpected error: ' + err.message, true);
    }
  });

  $('signOutBtn').addEventListener('click', async () => {
    if(!supabaseClient) return;
    await supabaseClient.auth.signOut();
    $('loggedInView').style.display = 'none';
    $('authView').style.display = 'block';
    $('status').className = '';
  });

  if(supabaseClient){
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if(session && session.user){
        const { data: profile } = await supabaseClient.from('profiles').select('name').eq('id', session.user.id).single();
        showLoggedIn(session.user, profile ? profile.name : null);
      }
    }).catch(()=>{});
  }
</script>
</body>
</html>
